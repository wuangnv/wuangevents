<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WuangEvents Design Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/atlas.css">
</head>
<body>
  <header class="atlas-toolbar">
    <div>
      <strong>WuangEvents Design Atlas</strong>
      <span id="screenCount"></span>
    </div>
    <div class="atlas-toolbar-actions">
      <select id="boardFilter" aria-label="Lọc nhóm màn hình"><option value="all">Tất cả nhóm</option></select>
      <select id="roleFilter" aria-label="Lọc vai trò"><option value="all">Tất cả vai trò</option></select>
      <button id="densityToggle" type="button">Thu gọn</button>
      <button id="sidebarToggle" type="button">Thu sidebar</button>
    </div>
  </header>
  <main id="atlas" class="atlas-grid" aria-live="polite"></main>
  <script type="module" src="src/atlas.js"></script>
</body>
</html>
